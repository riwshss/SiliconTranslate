name = "silk-translate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Models are an allowlist in src/app.ts (MODELS); PLAN_MODELS decides which ones each plan may
# use (the beta only gets deepseek/deepseek-v4-flash). The extension picks one per request.
# Plan of installs without a stored one (see resolvePlan); set to "free" when paid plans launch.
DEFAULT_PLAN = "beta"
# Daily limits, counted in source characters sent to the model (cache hits are free), reset at
# UTC midnight. The per-install limit is the level planned for the free tier after launch.
INSTALL_DAILY_CHARS = "100000"
IP_DAILY_CHARS = "300000"
# Wallet guard across all users, split over 16 counters; raise as the beta grows.
GLOBAL_DAILY_CHARS = "200000000"
# New install tokens per client IP per day (POST /v1/install).
INSTALLS_PER_IP_DAILY = "3"
# Transition for extension <= 2.2 (unsigned install ids, /v1/chat/completions): everything it
# sends shares LEGACY_DAILY_CHARS per day, and after LEGACY_UNTIL the old endpoint answers 410.
LEGACY_UNTIL = "2026-10-31T00:00:00Z"
LEGACY_DAILY_CHARS = "200000"
# Single request ceilings.
MAX_REQUEST_CHARS = "24000"
MAX_OUTPUT_TOKENS = "8192"
# OpenRouter routing: providers slower than this (tokens/s, median) are only used as fallbacks.
MIN_PROVIDER_THROUGHPUT = "50"
# Shown to OpenRouter for app attribution.
APP_URL = "https://github.com/riwshss/SiliconTranslate"
APP_TITLE = "Silk Translate"

# Secrets, never committed:
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put INSTALL_SECRET      (e.g. `openssl rand -base64 32`; rotating it signs everyone out)
#   npx wrangler secret put DEV_INSTALL_IDS     (optional: your own install ids, comma separated → developer plan,
#                                                every model and no quota; see README "开发者账号")

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# One data point per /v1/translate request: blobs [model, provider, errorCode, kind, plan],
# doubles [chars, ttftMs, totalMs, cachedTokens, cacheHits].
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "silk_translate_requests"

# Paid plans, once they launch: `npx wrangler kv namespace create PLANS`, then
# [[kv_namespaces]]
# binding = "PLANS"
# id = "<namespace id>"
