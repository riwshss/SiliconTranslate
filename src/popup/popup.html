<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>丝译 Silk Translate</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <img class="logo" src="icons/logo-56.png" alt="" width="28" height="28" />
          <div>
            <h1><span data-i18n="appName"></span> <span id="beta-badge" class="badge">Beta</span></h1>
            <p data-i18n="tagline"></p>
          </div>
        </div>
        <span id="conn" class="pill" data-state="idle"></span>
      </header>

      <section class="card" id="page-card">
        <div class="row between">
          <div class="host"><span class="dot"></span><span id="host">—</span></div>
          <span id="page-status" class="muted small"></span>
        </div>
        <button id="translate-btn" class="primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
          <span data-i18n="translatePage"></span>
        </button>
        <div id="mode-seg" class="seg seg-lg" role="radiogroup" data-i18n-aria="displayMode" hidden>
          <button type="button" role="radio" data-value="original" data-i18n="modeOriginal"></button>
          <button type="button" role="radio" data-value="overlay" data-i18n="modeOverlayOnly"></button>
          <button type="button" role="radio" data-value="bilingual" data-i18n="modeBilingual"></button>
        </div>
        <div class="row between">
          <span class="label" data-i18n="thisSite"></span>
          <div id="rule-seg" class="seg seg-sm" role="radiogroup" data-i18n-aria="siteRules">
            <button type="button" role="radio" data-value="" data-i18n="ruleDefault"></button>
            <button type="button" role="radio" data-value="always" data-i18n="ruleAlways"></button>
            <button type="button" role="radio" data-value="never" data-i18n="ruleNever"></button>
          </div>
        </div>
        <p id="page-note" class="note" hidden></p>
        <div id="page-progress" class="silk-progress" hidden><i></i></div>
      </section>

      <section class="card">
        <h2 data-i18n="modelTitle"></h2>
        <div id="models" class="models" role="radiogroup" data-i18n-aria="modelLabel"></div>
        <p id="models-hint" class="hint models-hint" data-i18n="modelsBetaHint" hidden></p>
        <p class="hint" data-i18n="modelNote"></p>
        <div class="row">
          <button id="test-btn" class="secondary" type="button" data-i18n="checkQuota"></button>
          <span id="test-result" class="small" aria-live="polite"></span>
        </div>
        <div id="quota-meter" class="meter" hidden><i></i></div>
      </section>

      <section class="card">
        <h2 data-i18n="prefsTitle"></h2>
        <label class="field">
          <span data-i18n="targetLang"></span>
          <select id="lang"></select>
        </label>
        <div class="field">
          <span data-i18n="defaultMode"></span>
          <div id="default-mode" class="seg seg-sm" role="radiogroup" data-i18n-aria="defaultMode">
            <button type="button" role="radio" data-value="overlay" data-i18n="modeOverlay"></button>
            <button type="button" role="radio" data-value="bilingual" data-i18n="modeBilingual"></button>
          </div>
        </div>
        <div class="field">
          <span data-i18n="bilingualStyle"></span>
          <div id="style-seg" class="seg seg-sm" role="radiogroup" data-i18n-aria="bilingualStyle">
            <button type="button" role="radio" data-value="silk"><u class="demo-silk" data-i18n="styleSilk"></u></button>
            <button type="button" role="radio" data-value="dashed"><u class="demo-dashed" data-i18n="styleDashed"></u></button>
            <button type="button" role="radio" data-value="highlight"><mark class="demo-mark" data-i18n="styleHighlight"></mark></button>
          </div>
        </div>
        <label class="field">
          <span data-i18n="animateTranslations"></span>
          <span class="switch"><input id="animate" type="checkbox" /><i></i></span>
        </label>
        <label class="field">
          <span data-i18n="selection"></span>
          <span class="switch"><input id="selection" type="checkbox" /><i></i></span>
        </label>
        <label class="field">
          <span data-i18n="allSites"></span>
          <span class="switch"><input id="all-sites" type="checkbox" /><i></i></span>
        </label>
        <p class="hint" data-i18n="allSitesHint"></p>
        <div class="field">
          <span data-i18n="shortcut"></span>
          <button id="shortcut" class="kbd-btn" type="button" data-i18n-title="shortcutTitle"></button>
        </div>
        <p class="hint" data-i18n="shortcutHint"></p>
        <label class="field">
          <span data-i18n="uiLanguage"></span>
          <select id="ui-lang"></select>
        </label>
      </section>

      <footer>
        <a href="https://github.com/riwshss/SiliconTranslate#readme" target="_blank" rel="noreferrer" data-i18n="help"></a>
        <span id="saved" class="saved" data-i18n="saved"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
