<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>丝译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <img class="logo" src="icons/icon-128.png" alt="" width="34" height="34" />
          <div>
            <h1>丝译 <span id="beta-badge" class="badge">Beta</span></h1>
            <p>无痕网页翻译 · 云端 / 本地多引擎</p>
          </div>
        </div>
        <span id="conn" class="pill" data-state="idle">未配置</span>
      </header>

      <section class="card" id="page-card">
        <div class="row between">
          <div class="host"><span class="dot"></span><span id="host">—</span></div>
          <span id="page-status" class="muted small"></span>
        </div>
        <button id="translate-btn" class="primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
          <span>翻译此页</span>
        </button>
        <div id="mode-seg" class="seg seg-lg" role="radiogroup" aria-label="显示模式" hidden>
          <button type="button" role="radio" data-value="original">原文</button>
          <button type="button" role="radio" data-value="overlay">仅译文</button>
          <button type="button" role="radio" data-value="bilingual">双语对照</button>
        </div>
        <div class="row between">
          <span class="label">此网站</span>
          <div id="rule-seg" class="seg seg-sm" role="radiogroup" aria-label="网站规则">
            <button type="button" role="radio" data-value="">默认</button>
            <button type="button" role="radio" data-value="always">总是翻译</button>
            <button type="button" role="radio" data-value="never">从不</button>
          </div>
        </div>
        <p id="page-note" class="note" hidden></p>
      </section>

      <section class="card">
        <h2>翻译偏好</h2>
        <label class="field">
          <span>目标语言</span>
          <select id="lang"></select>
        </label>
        <div class="field">
          <span>默认模式</span>
          <div id="default-mode" class="seg seg-sm" role="radiogroup" aria-label="默认模式">
            <button type="button" role="radio" data-value="overlay">覆盖原文</button>
            <button type="button" role="radio" data-value="bilingual">双语对照</button>
          </div>
        </div>
        <div class="field">
          <span>双语样式</span>
          <div id="style-seg" class="seg seg-sm" role="radiogroup" aria-label="双语样式">
            <button type="button" role="radio" data-value="dashed"><u class="demo-dashed">虚线</u></button>
            <button type="button" role="radio" data-value="highlight"><mark class="demo-mark">高亮</mark></button>
          </div>
        </div>
        <label class="field">
          <span>划词翻译</span>
          <span class="switch"><input id="selection" type="checkbox" /><i></i></span>
        </label>
        <div class="field">
          <span>切换快捷键</span>
          <button id="shortcut" class="kbd-btn" type="button" title="点击后按下新的组合键"></button>
        </div>
        <p class="hint">快捷键循环：原文 → 默认模式 → 另一种模式</p>
      </section>

      <section class="card">
        <h2>翻译服务</h2>
        <label class="stack">
          <span>翻译引擎</span>
          <select id="provider"></select>
        </label>

        <div id="openai-group" class="group">
          <label class="stack">
            <span>API Key</span>
            <div class="input-wrap">
              <input id="api-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" />
              <button class="ghost-icon toggle-key" type="button" aria-label="显示/隐藏密钥">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </label>
          <label class="stack">
            <span>模型</span>
            <select id="model-select"></select>
          </label>
          <input id="model-custom" class="text" list="model-list" placeholder="输入模型名称，如 Qwen/Qwen2.5-7B-Instruct" spellcheck="false" hidden />
          <datalist id="model-list"></datalist>
        </div>

        <div id="google-group" class="group" hidden>
          <label class="stack">
            <span>Google Cloud API Key</span>
            <div class="input-wrap">
              <input id="google-key" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false" />
              <button class="ghost-icon toggle-key" type="button" aria-label="显示/隐藏密钥">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </label>
          <p class="hint">需在 Google Cloud 控制台启用 Cloud Translation API。按字符计费，每月前 50 万字符免费。密钥不要设置「HTTP 引荐来源」限制。</p>
        </div>

        <p id="chrome-note" class="hint" hidden></p>

        <div class="row">
          <button id="test-btn" class="secondary" type="button">测试连接</button>
          <span id="test-result" class="small" aria-live="polite"></span>
        </div>
        <details>
          <summary>高级设置</summary>
          <label id="base-url-field" class="stack">
            <span>API 地址</span>
            <input id="base-url" class="text" spellcheck="false" />
          </label>
          <label class="field">
            <span>最大并发请求</span>
            <input id="concurrency" class="num" type="number" min="1" max="8" step="1" />
          </label>
        </details>
      </section>

      <footer>
        <a id="help-link" href="https://github.com/riwshss/SiliconTranslate#readme" target="_blank" rel="noreferrer">使用说明 ↗</a>
        <span id="saved" class="saved">已保存</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
